name: Orvia
options:
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 4.1.1
    CURRENT_PROJECT_VERSION: 21
    SWIFT_VERSION: 5.0
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.richadfarias.orvia
    CODE_SIGN_ENTITLEMENTS: Orvia/Resources/Orvia.entitlements
    INFOPLIST_FILE: Orvia/Resources/Info.plist
    GENERATE_INFOPLIST_FILE: NO
targets:
  Orvia:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Orvia/App
      - path: Orvia/Core
      - path: Orvia/UI
      - path: Orvia/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - Orvia.entitlements
    settings:
      base:
        PRODUCT_NAME: Orvia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Orvia
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity

  OrviaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: OrviaTests
    dependencies:
      - target: Orvia
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Orvia.app/Contents/MacOS/Orvia"
        INFOPLIST_FILE: ""
        PRODUCT_NAME: OrviaTests
        PRODUCT_BUNDLE_IDENTIFIER: com.richadfarias.orvia.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Orvia:
    build:
      targets:
        Orvia: all
    test:
      targets:
        - OrviaTests
