name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish (e.g. 4.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: xcode-27
    timeout-minutes: 60
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false

    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          RAW_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RAW_TAG:-}" ]]; then
            echo "Erro: nenhuma tag foi informada." >&2
            exit 1
          fi
          # Tags do Orvia usam X.Y.Z (sem prefixo v).
          tag="${RAW_TAG#v}"
          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${RAW_TAG}" >&2
            exit 1
          fi
          echo "checkout_ref=${tag}" >> "${GITHUB_OUTPUT}"
          echo "raw_tag=${RAW_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Checkout/build na tag: ${tag}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project version matches release tag
        env:
          RAW_TAG: ${{ steps.ref.outputs.raw_tag }}
        run: |
          set -euo pipefail
          chmod +x Scripts/version.sh Scripts/bump_versions.sh Scripts/release.sh Scripts/release_dmg.sh
          ./Scripts/version.sh check
          ./Scripts/version.sh compare-tag "${RAW_TAG}"

      - name: Select distribution mode
        id: distribution
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          configured=0
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!name}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "${configured}" -eq 6 ]]; then
            echo "mode=notarized" >> "${GITHUB_OUTPUT}"
          elif [[ "${configured}" -eq 0 ]]; then
            echo "mode=unsigned" >> "${GITHUB_OUTPUT}"
            echo "Apple distribution credentials are absent; publishing unsigned packages with explicit release notes."
          else
            echo "Apple distribution credentials are incomplete (${configured}/6)." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: steps.distribution.outputs.mode == 'notarized'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/orvia-certificate.p12"
          keychain_path="${RUNNER_TEMP}/orvia-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security list-keychains -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          rm -f "${certificate_path}"

      - name: Test
        run: |
          xcodebuild test -project Orvia.xcodeproj -scheme Orvia \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build release artifacts
        run: |
          ./Scripts/release.sh

      - name: Sign and notarize app
        if: steps.distribution.outputs.mode == 'notarized'
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="build/Orvia.xcarchive/Products/Applications/Orvia.app"
          codesign --force --options runtime --timestamp \
            --entitlements Orvia/Resources/Orvia.entitlements \
            --sign "${SIGNING_IDENTITY}" "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" build/Orvia.zip
          xcrun notarytool submit build/Orvia.zip \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait --output-format json | /usr/bin/python3 -c \
              'import json,sys; result=json.load(sys.stdin); print(result["status"]); sys.exit(result["status"] != "Accepted")'
          xcrun stapler staple "${app}"
          spctl --assess --type execute --verbose=2 "${app}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" build/Orvia.zip
          shasum -a 256 build/Orvia.zip > build/Orvia.zip.sha256

      - name: Build DMG
        env:
          DISTRIBUTION_MODE: ${{ steps.distribution.outputs.mode }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ./Scripts/release_dmg.sh
          if [[ "${DISTRIBUTION_MODE}" == "notarized" ]]; then
            xcrun notarytool submit build/Orvia.dmg \
              --apple-id "${APPLE_ID}" \
              --password "${APPLE_APP_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              --wait --output-format json | /usr/bin/python3 -c \
                'import json,sys; result=json.load(sys.stdin); print(result["status"]); sys.exit(result["status"] != "Accepted")'
            xcrun stapler staple build/Orvia.dmg
            shasum -a 256 build/Orvia.dmg > build/Orvia.dmg.sha256
          fi

      - name: Verify built app version
        run: |
          ./Scripts/version.sh verify-app "build/Orvia.xcarchive/Products/Applications/Orvia.app"
          shasum -a 256 -c build/Orvia.zip.sha256 build/Orvia.dmg.sha256

      - name: Publish GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.ref.outputs.checkout_ref }}
          DISTRIBUTION_MODE: ${{ steps.distribution.outputs.mode }}
        run: |
          set -euo pipefail

          assets=(
            build/Orvia.dmg
            build/Orvia.dmg.sha256
            build/Orvia.zip
            build/Orvia.zip.sha256
          )

          release_state="missing"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            release_state="$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft')"
          fi

          if [[ "${release_state}" == "false" ]]; then
            echo "Release ${TAG_NAME} is already public; checking its assets."
          else
            if [[ "${release_state}" == "missing" ]]; then
              notes_path="${RUNNER_TEMP}/orvia-release-notes.md"
              if [[ "${DISTRIBUTION_MODE}" == "notarized" ]]; then
                distribution_note="Assinado e notarizado pela Apple."
              else
                distribution_note="Esta distribuição não é assinada nem notarizada pela Apple. O macOS pode pedir confirmação em Ajustes > Privacidade e Segurança para abrir o app."
              fi

              {
                echo "## Instalação"
                echo ""
                echo "Baixe **Orvia.dmg**, abra o arquivo e arraste **Orvia.app** para Aplicativos."
                echo ""
                echo "${distribution_note}"
                echo ""
                echo "## Alterações"
                echo ""
                previous_tag="$(git tag --list | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG_NAME}$" | sort -V | tail -n 1 || true)"
                if [[ -n "${previous_tag}" ]]; then
                  git log --format='- %s' --no-merges "${previous_tag}..${TAG_NAME}"
                else
                  git log -1 --format='- %s' "${TAG_NAME}"
                fi
              } > "${notes_path}"

              gh release create "${TAG_NAME}" --draft --verify-tag \
                --title "Orvia ${TAG_NAME}" --notes-file "${notes_path}"
            fi
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          fi

          uploaded_assets="$(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name')"
          for asset in Orvia.dmg Orvia.dmg.sha256 Orvia.zip Orvia.zip.sha256; do
            if ! grep -Fxq "${asset}" <<< "${uploaded_assets}"; then
              echo "Missing release asset: ${asset}" >&2
              exit 1
            fi
          done

          if [[ "${release_state}" != "false" ]]; then
            gh release edit "${TAG_NAME}" --draft=false --latest
          fi
          gh release view "${TAG_NAME}" --json isDraft,url --jq '{isDraft,url}'
