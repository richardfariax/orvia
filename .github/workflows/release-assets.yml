name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload assets to (e.g. 2.0.0)"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: xcode-27

    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RAW_TAG:-}" ]]; then
            echo "Erro: nenhuma tag foi informada." >&2
            exit 1
          fi
          # Tags do Orvia usam X.Y.Z (sem prefixo v).
          tag="${RAW_TAG#v}"
          echo "checkout_ref=${tag}" >> "${GITHUB_OUTPUT}"
          echo "raw_tag=${RAW_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Checkout/build na tag: ${tag}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project version matches release tag
        env:
          RAW_TAG: ${{ steps.ref.outputs.raw_tag }}
        run: |
          set -euo pipefail
          chmod +x Scripts/version.sh Scripts/bump_versions.sh Scripts/release.sh Scripts/release_dmg.sh
          ./Scripts/version.sh check
          ./Scripts/version.sh compare-tag "${RAW_TAG}"

      - name: Check distribution credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing distribution secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/orvia-certificate.p12"
          keychain_path="${RUNNER_TEMP}/orvia-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security list-keychains -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          rm -f "${certificate_path}"

      - name: Test
        run: |
          xcodebuild test -project Orvia.xcodeproj -scheme Orvia \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build release artifacts
        run: |
          ./Scripts/release.sh

      - name: Sign and notarize app
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="build/Orvia.xcarchive/Products/Applications/Orvia.app"
          codesign --force --options runtime --timestamp \
            --entitlements Orvia/Resources/Orvia.entitlements \
            --sign "${SIGNING_IDENTITY}" "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" build/Orvia.zip
          xcrun notarytool submit build/Orvia.zip \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait --output-format json | /usr/bin/python3 -c \
              'import json,sys; result=json.load(sys.stdin); print(result["status"]); sys.exit(result["status"] != "Accepted")'
          xcrun stapler staple "${app}"
          spctl --assess --type execute --verbose=2 "${app}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" build/Orvia.zip
          shasum -a 256 build/Orvia.zip > build/Orvia.zip.sha256

      - name: Build and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./Scripts/release_dmg.sh
          xcrun notarytool submit build/Orvia.dmg \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait --output-format json | /usr/bin/python3 -c \
              'import json,sys; result=json.load(sys.stdin); print(result["status"]); sys.exit(result["status"] != "Accepted")'
          xcrun stapler staple build/Orvia.dmg
          shasum -a 256 build/Orvia.dmg > build/Orvia.dmg.sha256

      - name: Verify built app version
        run: |
          ./Scripts/version.sh verify-app "build/Orvia.xcarchive/Products/Applications/Orvia.app"

      - name: Resolve target release tag
        id: resolve_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_TAG: ${{ steps.ref.outputs.raw_tag }}
        run: |
          set -euo pipefail

          tag_name="${RAW_TAG}"
          if [[ "${tag_name}" == v* ]]; then
            alt_tag="${tag_name#v}"
          else
            alt_tag="v${tag_name}"
          fi

          resolve_release_tag() {
            local candidate="$1"
            if gh release view "${candidate}" >/dev/null 2>&1; then
              echo "${candidate}"
              return 0
            fi
            return 1
          }

          find_release_tag() {
            local primary="$1"
            local alternate="$2"
            local candidate=""

            if candidate="$(resolve_release_tag "${primary}")"; then
              echo "${candidate}"
              return 0
            fi
            if candidate="$(resolve_release_tag "${alternate}")"; then
              echo "${candidate}"
              return 0
            fi

            echo "Aguardando publicação da release '${primary}'..." >&2
            for _ in $(seq 1 24); do
              sleep 5
              if candidate="$(resolve_release_tag "${primary}")"; then
                echo "${candidate}"
                return 0
              fi
              if candidate="$(resolve_release_tag "${alternate}")"; then
                echo "${candidate}"
                return 0
              fi
            done
            return 1
          }

          if ! tag_name="$(find_release_tag "${tag_name}" "${alt_tag}")"; then
            echo "Erro: release não encontrada para '${RAW_TAG}' (também testado '${alt_tag}')." >&2
            echo "Releases disponíveis:" >&2
            gh release list --limit 20 >&2
            exit 1
          fi

          echo "resolved_tag=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "Release alvo: ${tag_name}"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve_tag.outputs.resolved_tag }}
        run: |
          gh release upload "$TAG_NAME" \
            build/Orvia.dmg \
            build/Orvia.dmg.sha256 \
            build/Orvia.zip \
            build/Orvia.zip.sha256 \
            --clobber
